[project]
name = "pdf-extract-backend"
version = "1.0.0"
description = "FastAPI + Celery backend for PDF extraction workflows"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",
    "PyMuPDF>=1.24.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "fakeredis>=2.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
