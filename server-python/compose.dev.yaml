name: pdf-extraction-stack-dev

x-app-env: &app-env
  REDIS_URL: redis://redis:6379
  REDIS_JOB_PREFIX: ${REDIS_JOB_PREFIX:-pdf:extract:job:}
  JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-604800}
  DOCUMENT_STORAGE_DIR: /data/uploads
  QUEUE_NAME: ${QUEUE_NAME:-pdf-extract}
  QUEUE_ATTEMPTS: ${QUEUE_ATTEMPTS:-3}
  QUEUE_BACKOFF_DELAY_MS: ${QUEUE_BACKOFF_DELAY_MS:-2000}
  NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}

x-watch: &watch
  develop:
    watch:
      - path: ./app
        target: /app/app
        action: sync
      - path: ./pyproject.toml
        target: /app/pyproject.toml
        action: rebuild
      - path: ./uv.lock
        target: /app/uv.lock
        action: rebuild

services:
  api:
    <<: *watch
    build:
      context: .
      target: dev
    container_name: pdf-extraction-api-dev
    environment:
      <<: *app-env
      PORT: 4000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdf_extract}:${POSTGRES_PASSWORD:-pdf_extract}@postgres:5432/${POSTGRES_DB:-pdf_extract}
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
    # #SYSTEM: DO NOT UNCOMMENT THIS UNLESS SPECIFIED!
      # postgres:
      #   condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - documents-data:/data/uploads

  worker:
    <<: *watch
    build:
      context: .
      target: dev
    container_name: pdf-extraction-worker-dev
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-1}"]
    environment:
      <<: *app-env
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-qwen3.7-plus}
      EXTRACTION_OUTPUT_DIR: /data/output
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - documents-data:/data/uploads
      - ../output:/data/output

