name: pdf-extraction-stack-dev

services:
  api:
    build:
      context: .
      target: dev
    container_name: pdf-extraction-api-dev
    environment:
      NODE_ENV: development
      PORT: 4000
      REDIS_URL: redis://redis:6379
      REDIS_JOB_PREFIX: ${REDIS_JOB_PREFIX:-pdf:extract:job:}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-604800}
      DOCUMENT_STORAGE_DIR: /data/uploads
      BULLMQ_QUEUE_NAME: ${BULLMQ_QUEUE_NAME:-pdf-extract}
      BULLMQ_ATTEMPTS: ${BULLMQ_ATTEMPTS:-3}
      BULLMQ_BACKOFF_DELAY_MS: ${BULLMQ_BACKOFF_DELAY_MS:-2000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdf_extract}:${POSTGRES_PASSWORD:-pdf_extract}@postgres:5432/${POSTGRES_DB:-pdf_extract}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
    # #SYSTEM: DO NOT UNCOMMENT THIS UNLESS SPECIFIED!
      # postgres:
      #   condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - documents-data:/data/uploads
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync+restart
        - path: ./package.json
          target: /app/package.json
          action: rebuild
        - path: ./tsconfig.json
          target: /app/tsconfig.json
          action: rebuild

  worker:
    build:
      context: ./worker
      target: dev
    container_name: pdf-extraction-worker-dev
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_JOB_PREFIX: ${REDIS_JOB_PREFIX:-pdf:extract:job:}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-604800}
      DOCUMENT_STORAGE_DIR: /data/uploads
      BULLMQ_QUEUE_NAME: ${BULLMQ_QUEUE_NAME:-pdf-extract}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-qwen3.7-plus}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - documents-data:/data/uploads
    develop:
      watch:
        - path: ./worker
          target: /app/worker
          action: sync+restart
        - path: ./worker/requirements.txt
          target: /app/worker/requirements.txt
          action: rebuild

