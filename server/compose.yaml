name: pdf-extraction-stack

services:
  api:
    build:
      context: .
      target: prod
    container_name: pdf-extraction-api
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
      REDIS_JOB_PREFIX: ${REDIS_JOB_PREFIX:-pdf:extract:job:}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-604800}
      DOCUMENT_STORAGE_DIR: /data/uploads
      BULLMQ_QUEUE_NAME: ${BULLMQ_QUEUE_NAME:-pdf-extract}
      BULLMQ_ATTEMPTS: ${BULLMQ_ATTEMPTS:-3}
      BULLMQ_BACKOFF_DELAY_MS: ${BULLMQ_BACKOFF_DELAY_MS:-2000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdf_extract}:${POSTGRES_PASSWORD:-pdf_extract}@postgres:5432/${POSTGRES_DB:-pdf_extract}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - documents-data:/data/uploads
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      target: prod
    container_name: pdf-extraction-worker
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_JOB_PREFIX: ${REDIS_JOB_PREFIX:-pdf:extract:job:}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-604800}
      DOCUMENT_STORAGE_DIR: /data/uploads
      BULLMQ_QUEUE_NAME: ${BULLMQ_QUEUE_NAME:-pdf-extract}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-qwen3.7-plus}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - documents-data:/data/uploads
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: pdf-extraction-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdf_extract}
      POSTGRES_USER: ${POSTGRES_USER:-pdf_extract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf_extract}
    ports:
      - 127.0.0.1:5430:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pdf-extraction-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  documents-data:
