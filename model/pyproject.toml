[project]
name = "takeoff-model"
version = "0.1.0"
description = "Floor-plan segmentation model: walls, doors, windows, rooms, columns and stairs, returned as takeoff JSON."
requires-python = ">=3.15"
dependencies = [
    "torch>=2.5",
    "segmentation-models-pytorch>=0.4",
    "timm>=1.0",
    "albumentations>=2.0",
    "opencv-python-headless>=4.10",
    "pymupdf>=1.24.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
takeoff-synth = "takeoff_model.synth:main"
takeoff-prepare = "takeoff_model.prepare:main"
takeoff-train = "takeoff_model.train:main"
takeoff-predict = "takeoff_model.predict:main"
takeoff-evaluate = "takeoff_model.evaluate:main"
takeoff-coco = "takeoff_model.coco:main"
takeoff-serve = "takeoff_model.serve:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takeoff_model"]
